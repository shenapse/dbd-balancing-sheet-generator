name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Why a reusable workflow instead of `workflow_run` on "CI": workflow_run for tag pushes is unreliable
# (head_branch holds the tag name, the run uses the default branch's workflow file, and semver
# metadata would have to be reconstructed from head_sha). Calling the same checks.yml and gating the
# publish job with `needs:` keeps github.ref / tag context intact, so semver tags work unchanged.
jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read pinned dbd-assets ref
        id: assets
        run: echo "ref=$(tr -d '[:space:]' < dbd-assets.ref)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # No `latest`: data changes more often than the tool, so a release-gated `latest` would
          # carry older assets than `main`. `main` is the rolling tag; versions and sha-* pin.
          # latest=false also stops the action from adding `latest` to semver builds by default.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Build into the local Docker store (not pushed yet) so the exact image that is published is
      # the one regression-tested below. For multi-arch (linux/arm64 + docker/setup-qemu-action),
      # `load` needs the containerd image store, and only the runner's native arch gets tested.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DBD_ASSETS_REF=${{ steps.assets.outputs.ref }}
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Regression test the image
        run: npm run test:image
        env:
          BSG_TEST_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

      - name: Upload regression diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diffs-release
          path: output-regression/
          if-no-files-found: ignore

      - name: Push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while read -r tag; do
            if [ -n "$tag" ]; then docker push "$tag"; fi
          done <<< "$TAGS"
