name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Why a reusable workflow instead of `workflow_run` on "CI": workflow_run for tag pushes is unreliable
# (head_branch holds the tag name, the run uses the default branch's workflow file, and semver
# metadata would have to be reconstructed from head_sha). Calling the same checks.yml and gating the
# publish job with `needs:` keeps github.ref / tag context intact, so semver tags work unchanged.
jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read pinned dbd-assets ref
        id: assets
        run: echo "ref=$(tr -d '[:space:]' < dbd-assets.ref)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Add linux/arm64 here (plus docker/setup-qemu-action before buildx) for multi-arch.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DBD_ASSETS_REF=${{ steps.assets.outputs.ref }}
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
