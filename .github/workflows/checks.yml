# Reusable CI jobs (tests + golden regression of the Docker image). Called by ci.yml (PRs, main) and publish.yml
# (main, v* tags) so an image is only published after exactly these checks pass.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Read pinned dbd-assets ref
        id: assets
        run: echo "ref=$(tr -d '[:space:]' < dbd-assets.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out dbd-assets
        uses: actions/checkout@v4
        with:
          repository: shenapse/dbd-assets
          ref: ${{ steps.assets.outputs.ref }}
          path: dbd-assets-ci

      - run: npm test
        env:
          DBD_ASSETS_ROOT: ${{ github.workspace }}/dbd-assets-ci

      - name: Upload regression diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diffs
          path: output-regression/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node runs the regression suite on the host; the sheets themselves are rendered in the image.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@v3

      - name: Read pinned dbd-assets ref
        id: assets
        run: echo "ref=$(tr -d '[:space:]' < dbd-assets.ref)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: bsg:ci
          build-args: |
            DBD_ASSETS_REF=${{ steps.assets.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: docker run --rm bsg:ci version

      # Same cases, goldens and snapshots as `npm test`, but every sheet comes from the image's CLI.
      - name: Regression test the image
        run: npm run test:image
        env:
          BSG_TEST_IMAGE: bsg:ci

      - name: Upload regression diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diffs-image
          path: output-regression/
          if-no-files-found: ignore
